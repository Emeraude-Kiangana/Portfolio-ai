name: Skill 001 CI Proof

on:
  push:
    branches:
      - skill/001-continuous-integration-proof
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs/skill_001_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run proof test
        run: python -m pytest -q
